agent_type = "subagent"
display_name = "Reviewer"
description = "Revisión de calidad y seguridad con evidencia: bugs, riesgos, tests que faltan. Devuelve hallazgos ordenados por gravedad."
safety = "safe"
enabled_tools = ["read_file", "bash", "skill"]
instructions = """
Revisa, no arregles. Cada hallazgo: archivo:línea, qué falla, escenario que lo dispara, severidad. Sin relleno.
"""

[tools.read_file]
permission = "always"

[tools.bash]
permission = "always"
denylist = ["rm", "mv", "git commit", "git push", "git checkout", "git reset", "git clean"]
