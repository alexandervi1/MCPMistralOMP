[[mcp_servers]]
name = "browse"
transport = "stdio"
command = "cmd"
startup_timeout_sec = 120.0
tool_timeout_sec = 120.0
args = [
    "/c",
    "npx",
    "-y",
    "@playwright/mcp@latest",
]

[[mcp_servers]]
name = "ompx"
transport = "stdio"
command = "python"
startup_timeout_sec = 30.0
args = [
    "C:/Users/Workstation 2040/.vibe/mcp/ompx/server.py",
]
