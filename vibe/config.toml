theme = "ansi-dark"
active_model = "deepseek-v4-1-flash-1017"
default_agent = "accept-edits"
outside_workdir = "ask"
enable_subagents = true
max_subagents = 8
max_concurrent_subagents = 4
enable_background_processes = true
auto_worktree = false
worktree_limit = 10
include_project_context = true
output_limit_retries = 2
enable_pr_monitoring = false
enable_telemetry = false
show_thinking_nodes = true
collapse_turn_details = true
vim_keybindings = false

[project_context]
default_commit_count = 5
timeout_seconds = 2.0

[session_logging]
enabled = true
generate_titles = true

[[models]]
name = "deepseek-v4-1-flash-1017"
provider = "mistral"
alias = "deepseek-v4-1-flash-1017"
display_name = "DeepSeek V4.1 Flash"
thinking = "high"
thinking_levels = ["none", "low", "high", "xhigh", "max"]
max_context_length = 1048576
auto_compact_threshold = 600000

[[models]]
name = "mistral-medium-3.5"
provider = "mistral"
alias = "small"
display_name = "Mistral Medium 3.5"
thinking_levels = ["none", "high"]

[compaction_model]
name = "mistral-large-4-0"
provider = "mistral"
alias = "mistral-large-4-0"

[utility_models]
smart_approve = "active"
title = "small"

[tools.bash]
permission = "always"
denylist = [
    "rm -rf",
    "rm -fr",
    "git reset --hard",
    "git clean -fd",
    "git push --force",
    "git push -f",
    "npm publish",
    "pnpm publish",
    "yarn publish",
]
denylist_standalone = [
    "rm",
    "rmdir",
    "del",
]
sensitive_patterns = [
    "sudo",
    "rm",
    "mv",
    "chmod",
    "chown",
    "reg",
    "sc",
    "netsh",
    "takeown",
    "icacls",
    "ssh",
    "scp",
    "mkfs",
    "shutdown",
    "reboot",
]
max_output_bytes = 30000
default_timeout = 120
max_timeout_seconds = 300

[tools.git_bash]
permission = "always"
denylist = [
    "rm -rf",
    "rm -fr",
    "git reset --hard",
    "git clean -fd",
    "git push --force",
    "git push -f",
    "npm publish",
    "pnpm publish",
    "yarn publish",
]
denylist_standalone = [
    "rm",
    "rmdir",
]
sensitive_patterns = [
    "sudo",
    "rm",
    "mv",
    "chmod",
    "chown",
    "curl",
    "ssh",
    "scp",
]
max_output_bytes = 30000
default_timeout = 120
max_timeout_seconds = 300

[tools.powershell]
permission = "always"
denylist = [
    "Remove-Item -Recurse -Force",
    "Format-Volume",
    "git reset --hard",
    "git clean -fd",
    "git push --force",
]
denylist_standalone = [
    "Remove-Item",
    "Clear-Disk",
]
sensitive_patterns = [
    "Invoke-WebRequest",
    "Invoke-Expression",
    "Start-Process",
    "reg",
    "sc",
    "netsh",
    "takeown",
    "icacls",
    "Remove-Item",
    "Stop-Process",
]
max_output_bytes = 30000
default_timeout = 120
max_timeout_seconds = 300

[tools.read_file]
permission = "always"
sensitive_patterns = [
    "**/.env",
    "**/.env.*",
    "**/.env~",
    "**/.envrc",
    "**/.envrc.*",
    "**/.envrc~",
    "**/secrets/**",
    "**/*.pem",
    "**/*.key",
    "**/.ssh/**",
]

[tools.write_file]
permission = "always"
sensitive_patterns = [
    "**/.env",
